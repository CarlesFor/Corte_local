name: Compilar y comprobar Windows
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci
      - run: npm run setup:electron
      - run: npm run dist
      - run: npm test
      - run: npm run test:packaged
      - run: npm run test:portable
      - run: node scripts/release-checksums.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: Corte-Local-Windows
          compression-level: 0
          retention-days: 7
          path: |
            release/Corte-Local-Windows.exe
            release/Corte-Local-Instalador-Windows.exe
            release/Corte-Local-Windows.zip
            release/SHA256SUMS.txt
